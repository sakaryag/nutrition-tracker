{% extends "base.html" %}
{% block title %} — Register{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="auth-card auth-card--wide">
    <h1 class="auth-card__title" data-i18n="auth.register">Create Account</h1>
    {% if error %}
    <p class="auth-card__error">{{ error }}</p>
    {% endif %}
    <form method="POST" action="/register" novalidate>
      <div class="form-group">
        <label for="username" data-i18n="auth.username">Username</label>
        <input type="text" id="username" name="username" class="form-control" required autofocus />
      </div>
      <div class="form-group">
        <label for="password" data-i18n="auth.password">Password</label>
        <input type="password" id="password" name="password" class="form-control" minlength="6" required />
      </div>
      <div class="form-group">
        <label for="confirm" data-i18n="auth.confirmPassword">Confirm Password</label>
        <input type="password" id="confirm" name="confirm" class="form-control" minlength="6" required />
      </div>

      <!-- Role picker -->
      <div class="form-group">
        <label>I am joining as…</label>
        <div class="role-picker">
          <label class="role-card role-card--selected" id="role-member-label">
            <input type="radio" name="role" value="member" checked hidden />
            <div class="role-card__icon">🥗</div>
            <div class="role-card__body">
              <div class="role-card__title">Member</div>
              <div class="role-card__desc">Track my own nutrition, log meals, monitor macros and calories.</div>
            </div>
          </label>
          <label class="role-card" id="role-dietitian-label">
            <input type="radio" name="role" value="dietitian" hidden />
            <div class="role-card__icon">🩺</div>
            <div class="role-card__body">
              <div class="role-card__title">Dietitian / Coach</div>
              <div class="role-card__desc">Create nutrition plans, assign them to clients, and review their progress.</div>
            </div>
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" data-i18n="auth.createAccount">Register</button>
    </form>
    {% if google_oauth_enabled %}
    <div class="auth-divider"><span>or</span></div>
    <a href="/auth/google" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </a>
    {% endif %}
    <p class="auth-card__footer"><span data-i18n="auth.haveAccount">Already have an account?</span> <a href="/login" data-i18n="auth.loginLink">Log in</a></p>
  </div>
</section>

<script>
(function () {
  var cards = document.querySelectorAll('.role-card');
  cards.forEach(function (card) {
    card.addEventListener('click', function () {
      cards.forEach(function (c) { c.classList.remove('role-card--selected'); });
      card.classList.add('role-card--selected');
    });
  });
})();
</script>
{% endblock %}
