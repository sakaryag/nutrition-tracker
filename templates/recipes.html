{% extends "base.html" %}
{% block title %} — Recipes{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Recipes</h1>
  <button class="btn btn-primary" id="btn-new-recipe">+ New Recipe</button>
</div>

<div class="search-bar">
  <input type="text" id="recipe-search" class="form-control" placeholder="Search recipes…" />
</div>

<div id="recipe-list" class="card-grid"></div>

<!-- Recipe modal -->
<dialog id="recipe-modal" class="modal-dialog">
  <form id="recipe-form" class="modal-form" method="dialog">
    <h2 id="recipe-modal-title">New Recipe</h2>

    <div class="form-row">
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="rf-name" class="form-control" required />
      </div>
      <div class="form-group">
        <label>Name (TR)</label>
        <input type="text" id="rf-name-tr" class="form-control" />
      </div>
    </div>

    <div class="form-group">
      <label>Prep Notes</label>
      <textarea id="rf-prep-notes" class="form-control" rows="2"></textarea>
    </div>
    <div class="form-group">
      <label>Prep Notes (TR)</label>
      <textarea id="rf-prep-notes-tr" class="form-control" rows="2"></textarea>
    </div>

    <h3>Ingredients</h3>
    <div class="search-bar" style="margin-bottom:.5rem">
      <input type="text" id="ing-search" class="form-control" placeholder="Search foods to add…" autocomplete="off" />
      <ul id="ing-ac" class="autocomplete-list" hidden role="listbox"></ul>
    </div>
    <table class="data-table" id="ing-table">
      <thead>
        <tr><th>Food</th><th>Qty</th><th>Unit</th><th>Protein</th><th>Fat</th><th>Carbs</th><th>kcal</th><th></th></tr>
      </thead>
      <tbody id="ing-body"></tbody>
      <tfoot>
        <tr id="ing-totals" class="table-total">
          <td><strong>Totals</strong></td>
          <td colspan="2"></td>
          <td id="tot-p">—</td><td id="tot-f">—</td><td id="tot-c">—</td><td id="tot-k">—</td>
          <td></td>
        </tr>
      </tfoot>
    </table>

    <div class="modal-actions">
      <button type="button" class="btn btn-outline" id="recipe-cancel">Cancel</button>
      <button type="submit" class="btn btn-primary">Save Recipe</button>
    </div>
  </form>
</dialog>
{% endblock %}

{% block scripts %}
<script src="/static/js/recipes.js"></script>
{% endblock %}
