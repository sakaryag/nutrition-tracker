name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/nutritrack:${{ github.sha }} \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/nutritrack:latest \
            .

      - name: Push to Google Container Registry
        run: |
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/nutritrack:${{ github.sha }}
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/nutritrack:latest

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: nutritrack
          region: us-central1
          image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/nutritrack:${{ github.sha }}
          env_vars: AUTH_ENABLED=true
          secrets: |
            DATABASE_URL=nutritrack-db-url:latest
            SECRET_KEY=nutritrack-secret:latest
          flags: >-
            --allow-unauthenticated
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=10

      - name: Show deployed URL
        run: |
          echo "Service URL: ${{ steps.deploy.outputs.url }}"